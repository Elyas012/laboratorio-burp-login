<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso confirmado | Laboratorio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1221;color:#eef5ff;display:grid;min-height:100vh;place-items:center;font-family:system-ui,sans-serif;padding:20px}.card{max-width:500px;width:100%;border:1px solid #36506b;background:#14243a;border-radius:18px;padding:35px;text-align:center;box-shadow:0 20px 60px #0005}.check{font-size:50px}h1{font-size:25px}p{color:#a5bad1;line-height:1.6}button{border:0;border-radius:9px;background:#38a7eb;color:#09203c;padding:13px 25px;font-weight:700;cursor:pointer}.tag{font-size:12px;color:#95cafa}</style></head><body><div class="card"><div class="check">✅</div><h1>Autenticación correcta</h1><p>Has iniciado sesión con la cuenta educativa <strong>{{ username }}</strong>.</p><p class="tag">Modo: {{ 'protección activa' if protected else 'prueba controlada' }}</p><p>Este panel no contiene datos reales. Es una evidencia para el laboratorio de seguridad.</p><form method="post" action="/logout"><button type="submit">Cerrar sesión</button></form></div></body></html>
